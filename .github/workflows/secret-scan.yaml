name: Secret Scan

# pull requests into main: gitleaks over every commit of the pull request, in under a minute
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  secret-scan:
    uses: Billy-Grace/bg_shared/.github/workflows/reusable-secret-scan.yaml@v1.14.0
